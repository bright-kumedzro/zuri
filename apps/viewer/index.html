<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zuri — viewer</title>
    <style>
      :root { color-scheme: dark; --bg: #0e0f12; --panel: #16181d; --line: #262931; --text: #e8e9ec; --muted: #8b8f99; --accent: #f2a65a; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      h1 span { color: var(--accent); }
      label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); color: #1a1208; border: 0; font-weight: 600; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      main { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
      #stage { position: relative; min-height: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #status { position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 12px; }
      #gallery { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
      #gallery figure { margin: 0; cursor: pointer; text-align: center; }
      #gallery img { width: 100%; aspect-ratio: 1; border-radius: 50%; background: #20232a; object-fit: cover; }
      #gallery figcaption { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      pre { margin: 0; font-size: 11px; color: var(--muted); white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 260px; overflow: auto; }
    </style>
  </head>
  <body>
    <aside>
      <h1>zuri<span>.</span></h1>
      <label>Seed <input id="seed" value="ama@example.com" spellcheck="false" /></label>
      <div class="row">
        <button id="random">Random</button>
        <button id="export" class="primary">Export .glb</button>
      </div>
      <div class="row">
        <label>Gender
          <select id="gender"><option value="">Any</option><option>female</option><option>male</option></select>
        </label>
        <label>Ethnicity
          <select id="ethnicity"><option value="">Any</option><option>african</option><option>asian</option><option>caucasian</option><option>mixed</option></select>
        </label>
      </div>
      <div class="row">
        <label>Expression
          <select id="expression"><option>neutral</option><option>smile</option><option>grin</option><option>surprised</option><option>serious</option><option>sad</option></select>
        </label>
        <label>Framing
          <select id="framing"><option value="bust">Avatar</option><option value="full">Full body</option></select>
        </label>
      </div>
      <label><span><input id="clothed" type="checkbox" checked style="width:auto" /> Clothed</span></label>
      <pre id="params"></pre>
    </aside>
    <main>
      <div id="stage"><div id="status">loading…</div></div>
      <div id="gallery"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
